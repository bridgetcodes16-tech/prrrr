<style>
/* ---------- Themes ---------- */
:root, html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000; --panel: #0b0f0c; --panel2: #121a14; --field: #050805; --line: #1f2d23;
  --text: #e8f5ec; --muted: #93a99a;
  --g: #22c55e; --g-soft: #0b1d12; --g-line: #2c6b42;
  --btn-bg: linear-gradient(135deg, #22c55e, #4ade80); --btn-text: #031a0a; --btn-shadow: 0 6px 18px rgba(34,197,94,.25);
  --bad: #f87171; --bad-bg: #1a0b0b; --bad-line: #5b2323; --ok-bg: #07160d;
  --shadow: none;
  --glow: radial-gradient(900px 420px at 50% -120px, rgba(34,197,94,.22), transparent 70%), radial-gradient(520px 320px at 100% 100%, rgba(163,230,53,.08), transparent 70%);
  --flame: #fb923c; --gold: #facc15; --silver: #cbd5e1; --bronze: #d6844a;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f2fbf4; --panel: #ffffff; --panel2: #e9f7ed; --field: #f7fcf8; --line: #cde4d3;
  --text: #0c1f12; --muted: #48664f;
  --g: #15803d; --g-soft: #e1f5e7; --g-line: #7fc695;
  --btn-bg: #15803d; --btn-text: #ffffff; --btn-shadow: 0 6px 16px rgba(21,128,61,.22);
  --bad: #b91c1c; --bad-bg: #fef2f2; --bad-line: #fecaca; --ok-bg: #ecfdf3;
  --shadow: 0 6px 22px rgba(21,128,61,.08);
  --glow: radial-gradient(900px 420px at 50% -120px, rgba(34,197,94,.22), transparent 70%), radial-gradient(520px 320px at 100% 100%, rgba(132,204,22,.12), transparent 70%);
  --flame: #ea580c; --gold: #ca8a04; --silver: #64748b; --bronze: #b45309;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 16px; line-height: 1.55; transition: background .25s, color .25s; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: var(--glow); pointer-events: none; }
main { max-width: 980px; margin: 0 auto; padding: 28px 20px 70px; }
h1, h2, h3 { margin: 0; line-height: 1.15; letter-spacing: -0.01em; font-weight: 900; }
h1 { font-size: 34px; }
h2 { font-size: 21px; }
h3 { font-size: 15px; color: var(--muted); font-weight: 800; margin-bottom: 12px; }
p { margin: 0; }
.muted { color: var(--muted); }
.accent { color: var(--g); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--g); outline-offset: 2px; }
i.fa-solid, i.fa-regular { line-height: 1; }

/* ---------- Top bar ---------- */
.bar { position: sticky; top: 0; z-index: 5; flex-wrap: wrap; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 22px; letter-spacing: -0.02em; }
.logo { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; background: var(--btn-bg); color: var(--btn-text); font-size: 19px; box-shadow: var(--btn-shadow); transform: rotate(-6deg); }
.nav { display: flex; align-items: center; gap: 8px; }
.who { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 700; padding: 0 6px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; background: var(--btn-bg); color: var(--btn-text); border: 1px solid transparent; padding: 12px 20px; border-radius: 12px; font-weight: 800; box-shadow: var(--btn-shadow); transition: transform .12s, filter .15s, background .15s, border-color .15s; }
.btn:hover { filter: brightness(1.07); transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn.alt { background: transparent; color: var(--g); border-color: var(--g-line); box-shadow: none; }
.btn.alt:hover, .btn.alt.on { background: var(--g-soft); filter: none; border-color: var(--g); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); box-shadow: none; }
.btn.ghost:hover { background: var(--panel2); filter: none; border-color: var(--g-line); }
.btn.sm { padding: 8px 13px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Forms ---------- */
label { display: block; margin-bottom: 14px; font-size: 14px; font-weight: 800; }
.field { position: relative; display: block; margin-top: 6px; }
.field > i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
input { display: block; width: 100%; padding: 12px 12px 12px 42px; background: var(--field); color: var(--text); border: 1.5px solid var(--line); border-radius: 12px; font: inherit; font-weight: 600; transition: border-color .15s, box-shadow .15s; }
input:focus { outline: none; border-color: var(--g); box-shadow: 0 0 0 4px color-mix(in srgb, var(--g) 22%, transparent); }
.field:focus-within > i { color: var(--g); }
.msg { display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; border-radius: 12px; font-size: 14px; font-weight: 700; margin: 14px 0; border: 1px solid; }
.msg::before { font-family: 'Font Awesome 6 Free'; font-weight: 900; margin-top: 1px; }
.msg.err { color: var(--bad); border-color: var(--bad-line); background: var(--bad-bg); }
.msg.err::before { content: '\f071'; }
.msg.ok { color: var(--g); border-color: var(--g-line); background: var(--ok-bg); }
.msg.ok::before { content: '\f058'; }
.msg:empty { display: none; }

/* ---------- Cards ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.ico { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--g-soft); color: var(--g); font-size: 17px; }
.chips { list-style: none; padding: 0; margin: 0; display: flex; gap: 10px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); }
.chip strong { display: block; font-size: 22px; line-height: 1.05; font-weight: 900; }
.chip span.t { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.chip .ico.fire { color: var(--flame); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .45s both; animation-delay: calc(var(--i, 0) * 70ms); }

/* ---------- Sign in page ---------- */
.auth { display: grid; grid-template-columns: 1.1fr 1fr; gap: 44px; align-items: center; min-height: calc(100vh - 150px); }
.hero-art { position: relative; width: 190px; height: 130px; margin-bottom: 14px; }
.brain-big { position: absolute; left: 0; top: 8px; width: 110px; height: 110px; border-radius: 32px; background: var(--btn-bg); color: var(--btn-text); display: flex; align-items: center; justify-content: center; font-size: 56px; transform: rotate(-7deg); box-shadow: 0 14px 40px rgba(34,197,94,.35); animation: pulse 3s ease-in-out infinite; }
@keyframes pulse { 50% { transform: rotate(-3deg) scale(1.05); } }
.floaty { position: absolute; color: var(--g); font-size: 22px; animation: bob 3.2s ease-in-out infinite; }
.f1 { left: 124px; top: 0; }
.f2 { left: 156px; top: 52px; color: var(--gold); animation-delay: -.8s; }
.f3 { left: 118px; top: 92px; animation-delay: -1.6s; font-size: 20px; }
.f4 { left: 4px; top: -6px; color: var(--flame); animation-delay: -2.2s; font-size: 18px; }
@keyframes bob { 50% { transform: translateY(-9px) rotate(8deg); } }
.hero h1 { font-size: 44px; }
.hero > p { margin-top: 14px; color: var(--muted); max-width: 440px; font-size: 17px; font-weight: 600; }
.hero .chips { margin-top: 26px; }
.form-card h2 { margin-bottom: 4px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--field); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 20px; }
.seg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: transparent; border: none; color: var(--muted); padding: 10px; border-radius: 10px; font-weight: 800; transition: background .15s, color .15s; }
.seg-btn.on { background: var(--btn-bg); color: var(--btn-text); }
.seg-btn:not(.on):hover { color: var(--text); }
.alt-actions { display: grid; gap: 10px; margin-top: 14px; }
.narrow-card { max-width: 560px; margin: 20px auto; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }

/* ---------- Home ---------- */
.page-head { margin-bottom: 22px; }
.page-head p { margin-top: 6px; font-weight: 600; }
.split { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.level-card { display: flex; flex-direction: column; gap: 14px; transition: transform .18s, border-color .18s; }
.level-card:hover { transform: translateY(-4px); border-color: var(--g-line); }
.level-top { display: flex; align-items: center; gap: 12px; }
.level-top h2 { flex: 1; }
.level-card .ico { width: 46px; height: 46px; font-size: 20px; }
.meter { display: inline-flex; gap: 4px; }
.meter i { width: 16px; height: 6px; border-radius: 3px; background: var(--line); }
.meter i.on { background: var(--g); }
.desc { color: var(--muted); font-size: 14px; font-weight: 600; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; font-size: 14px; margin: 0; padding-top: 14px; border-top: 1px dashed var(--line); align-items: center; }
.facts dt { color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.facts dt i { width: 16px; text-align: center; color: var(--g); }
.facts dd { margin: 0; text-align: right; font-weight: 800; overflow-wrap: anywhere; }
.level-card .btn { margin-top: auto; }
.notice { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; border-color: var(--g-line); margin-bottom: 16px; }
.notice p { color: var(--muted); font-size: 14px; margin-top: 2px; }
.tip { display: flex; align-items: center; gap: 10px; margin-top: 18px; color: var(--muted); font-size: 14px; font-weight: 600; }
.tip i { color: var(--gold); }

/* ---------- Quiz ---------- */
.quiz-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border: 1px solid var(--g-line); background: var(--g-soft); color: var(--g); border-radius: 999px; font-size: 14px; font-weight: 800; }
.timerbox { display: inline-flex; align-items: center; gap: 10px; padding: 7px 16px; border: 1px solid var(--g-line); border-radius: 14px; background: var(--panel); color: var(--g); font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
.timerbox i { font-size: 18px; }
.timerbox.low { color: var(--bad); border-color: var(--bad-line); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .5; } }
.progress { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; background: var(--btn-bg); border-radius: 999px; transition: width .3s; }
.progress-text { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 700; margin: 8px 0 18px; }
.q { font-size: 23px; font-weight: 800; margin-bottom: 16px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--field); color: var(--text); border: 1.5px solid var(--line); padding: 13px 14px; margin-top: 10px; border-radius: 14px; font-weight: 700; transition: border-color .15s, background .15s, transform .12s; }
.opt:hover { border-color: var(--g-line); background: var(--panel2); transform: translateX(3px); }
.opt .key { flex: none; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--line); border-radius: 9px; font-size: 13px; font-weight: 900; color: var(--muted); }
.opt .txt { flex: 1; }
.opt .tick { display: none; color: var(--g); font-size: 18px; }
.opt.sel { border-color: var(--g); background: var(--g-soft); animation: pop .22s; }
.opt.sel .key { background: var(--btn-bg); border-color: transparent; color: var(--btn-text); }
.opt.sel .tick { display: inline; }
@keyframes pop { 50% { transform: scale(1.015); } }
.quiz-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 22px; }
.quiz-actions .spacer { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 8px; }
.grid button { background: var(--field); color: var(--muted); border: 1.5px solid var(--line); padding: 8px 0; border-radius: 10px; font-weight: 800; font-size: 14px; transition: border-color .15s, transform .12s; }
.grid button:hover { border-color: var(--g-line); transform: translateY(-2px); }
.grid button.done { border-color: var(--g-line); color: var(--g); background: var(--g-soft); }
.grid button.cur { background: var(--btn-bg); color: var(--btn-text); border-color: transparent; }

/* ---------- Results ---------- */
.result-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.score { display: flex; align-items: baseline; gap: 12px; font-size: 68px; font-weight: 900; color: var(--g); line-height: 1; margin: 18px 0 8px; letter-spacing: -0.03em; }
.score i { font-size: 40px; color: var(--gold); align-self: center; }
.score small { font-size: 26px; color: var(--muted); font-weight: 800; }
.statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
.statrow > div { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--field); border-radius: 14px; padding: 12px 14px; }
.statrow strong { display: block; font-size: 21px; line-height: 1.1; font-weight: 900; }
.statrow span.t { font-size: 13px; color: var(--muted); font-weight: 700; }
.rev { padding: 12px 14px; margin-top: 10px; border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; font-size: 14px; background: var(--field); font-weight: 600; }
.rev.ok { border-left-color: var(--g); }
.rev.no { border-left-color: var(--bad); }
.rev strong { display: block; margin-bottom: 4px; font-weight: 800; }
.good { color: var(--g); }
.bad { color: var(--bad); }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.conf { position: absolute; top: -24px; animation: fall 2.4s ease-in forwards; }
@keyframes fall { to { transform: translateY(112vh) rotate(540deg); opacity: .85; } }

/* ---------- Leaderboard ---------- */
.row-tabs { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
.tabs { display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.tabs .seg-btn { padding: 8px 14px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 13px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 13px; font-weight: 800; }
tbody tr:last-child td { border-bottom: none; }
td.name { overflow-wrap: anywhere; font-weight: 800; }
tr.me td { background: var(--g-soft); }
.rank { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; border-radius: 10px; font-weight: 900; font-size: 14px; border: 1px solid var(--line); color: var(--muted); }
.rank.r1 { color: var(--gold); border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, transparent); font-size: 16px; }
.rank.r2 { color: var(--silver); border-color: var(--silver); background: color-mix(in srgb, var(--silver) 14%, transparent); font-size: 16px; }
.rank.r3 { color: var(--bronze); border-color: var(--bronze); background: color-mix(in srgb, var(--bronze) 14%, transparent); font-size: 16px; }
.streak { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
.streak i { color: var(--flame); }
.streak.off i { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 34px 10px; font-weight: 700; }

function rnd(n) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  catch (e) { return Math.floor(Math.random() * n); }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  return Math.floor(ms / 3600000) + 'h ' + Math.floor(ms % 3600000 / 60000) + 'm';
}

/* a small seeded random generator, so every device gets the same shuffle for the same day */
function hashStr(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  });

}

/* ---------- Sounds (made in the browser, so no audio files are needed) ---------- */
let soundOn = true;

let audioCtx = null;

function audio() {
  if (!soundOn) return null;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}

function tone(freq, start, dur, type, vol) {
  const c = audio();
  if (!c) return;
  const t0 = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(c.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.03);
}

      const email = val('email').trim();
      if (username.length < 3) return setMsg('Username must be at least 3 characters.');
      if (!/^\S+@\S+\.\S+$/.test(email)) return setMsg('Enter a valid email address.');
      if (val('pw').length < 6) return setMsg('Password must be at least 6 characters.');
      if (val('pw') !== val('pw2')) return setMsg('Passwords do not match.');
      busy(true);
      const chk = await sb.rpc('username_taken', { p_username: username });
      if (chk.error) { busy(false); return setMsg(friendly(chk.error)); }
      if (chk.data) { busy(false); return setMsg('That username is taken. Pick another one.'); }
      const { data, error } = await sb.auth.signUp({
        email, password: val('pw'),
        options: { data: { username }, emailRedirectTo: location.origin + location.pathname }
      });
      if (error) { busy(false); return setMsg(friendly(error)); }
      if (data.user && data.user.identities && data.user.identities.length === 0) {
        busy(false);
        return setMsg('That email already has an account. Log in instead.');
      }
      if (data.session) return enter();
      renderAuth('login', { ok: true, t: 'Account created. Check your email to confirm it, then log in.' });
    };
  }

  if (mode === 'forgot') {
    authShell('',
      '<h2>Forgot password</h2><p class="muted">Enter your email and we will send you a reset link.</p>' + msg +
      '<div id="f" style="margin-top:16px">' + field('Email', 'envelope', 'email', 'email', 'email') +
      '<button class="btn block" type="button" data-submit="1">' + ic('paper-plane') + 'Send reset link</button></div>' +
      '<div class="alt-actions"><button class="btn ghost block" type="button" data-auth="login">' + ic('arrow-left') + 'Back to log in</button></div>');
    onSubmit = async () => {
      const email = val('email').trim();
      if (!/^\S+@\S+\.\S+$/.test(email)) return setMsg('Enter a valid email address.');
      if (location.protocol === 'file:') return setMsg('Reset links only work once the site is hosted online.');
      busy(true);
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      busy(false);
      if (error) return setMsg(friendly(error));
      setMsg('If an account uses that email, a reset link is on its way. Open it on this device.', true);
    };
  }
}

/* After a successful login: load the profile, send any unsent scores, open the app.
   Offline, the last signed-in player can keep playing; scores upload when the internet is back. */
function startOffline(c) {
  uid = c.uid;
  user = c.username;
  route();
}

async function enter() {
  let session = null;
  if (sb) {
    try { const r = await sb.auth.getSession(); session = r && r.data ? r.data.session : null; } catch (e) {}
  }
  if (!session) {
    const c = db.get('br_last', null);
    if (c && !navigator.onLine) return startOffline(c);
    user = null; uid = null;
    return renderAuth('login', navigator.onLine ? undefined : { t: "You're offline. Log in once with internet, then you can play offline." });
  }
  uid = session.user.id;
  let name = null;
  try {
    const { data } = await sb.from('profiles').select('username').eq('id', uid).maybeSingle();
    if (data) name = data.username;
  } catch (e) {}
  if (!name) {
    const c = db.get('br_last', null);
    if (c && c.uid === uid) name = c.username;
  }
  if (!name) {
    user = null;
    renderNav('');
    app.innerHTML = '<div class="card narrow-card"><h2>' + ic('triangle-exclamation') + ' Could not load your profile</h2><p class="muted" style="margin:10px 0 16px">Check your connection and try again. If it keeps happening, make sure the SQL setup was run in Supabase.</p>' +
      '<div class="actions"><button class="btn" data-retry="1">' + ic('rotate-right') + 'Try again</button><button class="btn ghost" data-go="logout">' + ic('right-from-bracket') + 'Log out</button></div></div>';
    return;
  }
  user = name;
  db.set('br_last', { uid, username: name });
  flushPending();
  route();
}

/* ---------- Scores and leaderboard (stored online) ---------- */
async function lb(level, limit, period) {
  if (!sb || !navigator.onLine) throw new Error('offline');
  const { data, error } = await sb.rpc('leaderboard', { p_level: level, p_limit: limit || 20, p_period: period || 'all' });
  if (error) throw error;
  return data || [];
}

async function saveScore(row) {
  try {
    const { error } = await sb.from('scores').insert(row);
    if (!error) return true;
  } catch (e) {}
  const key = 'br_pending_' + uid;
  const list = db.get(key, []);
  list.push(row);
  db.set(key, list);
  return false;
}

async function flushPending() {
  const key = 'br_pending_' + uid;
  const list = db.get(key, []);
  if (!list.length || !sb) return;
  const keep = [];
  for (let i = 0; i < list.length; i++) {
    try {
      const { error } = await sb.from('scores').insert(list[i]);
      if (error && error.code !== '23514' && error.code !== '23505') { keep.push(...list.slice(i)); break; } // keep on network errors, drop rows the server rejects
    } catch (e) { keep.push(...list.slice(i)); break; }
  }
  if (keep.length) db.set(key, keep); else db.del(key);
}

/* ---------- Quiz ---------- */
function startQuiz(level) {
  let qs, limit = LIMIT, maxBonus = 100;
  if (level === 'daily') {
    if (dailyDone()) return renderHome();
    qs = dailySet(utcDay());
    limit = DAILY.limit;
    maxBonus = DAILY.maxBonus;
  } else {
    qs = shuffle(BANK[level]).slice(0, TOTAL).map(r => ({ q: r[0], opts: shuffle(r.slice(1)), correct: r[1], p: PER[level] }));
  }
  const now = Date.now();
  Q = { level, qs, answers: Array(qs.length).fill(null), cur: 0, start: now, end: now + limit * 1000, limit, maxBonus };
  saveQ();
  renderQuiz();
}

function saveQ() { if (Q && uid) db.set('br_quiz_' + uid, Q); }

function tick() {
  if (!Q) { clearInterval(timerId); return; }
  const left = Math.max(0, Math.ceil((Q.end - Date.now()) / 1000));
  const t = document.getElementById('timer');
  if (t) {
    t.textContent = fmt(left);
    t.parentElement.classList.toggle('low', left <= 60);
  }
  if (left <= 10 && left > 0) play('warn');
  if (left <= 0) finish(true);
}

function renderQuiz() {
  renderNav('');
  Q = db.get('br_quiz_' + uid, null);
  if (!Q) return renderHome();
  const i = Q.cur, item = Q.qs[i], n = Q.qs.length;
  const answered = Q.answers.filter(a => a !== null).length;
  const pct = Math.round((i + 1) / n * 100);

  app.innerHTML =
    '<div class="quiz-head"><span class="pill">' + ic(LVL_ICON[Q.level]) + levelName(Q.level) + '</span><span class="timerbox">' + ic('stopwatch') + '<span id="timer" aria-live="off"></span></span></div>' +
    '<div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="1" aria-valuemax="' + n + '" aria-valuenow="' + (i + 1) + '"><div class="fill" style="width:' + pct + '%"></div></div>' +
    '<div class="progress-text"><span>Question ' + (i + 1) + ' of ' + n + '</span><span>' + ic('circle-check') + ' ' + answered + ' answered</span></div>' +
    '<div class="card"><h2 class="q">' + (i + 1) + '. ' + esc(item.q) + '</h2>' +
      item.opts.map((o, k) => '<button class="opt' + (Q.answers[i] === k ? ' sel' : '') + '" data-opt="' + k + '"><span class="key">' +
        String.fromCharCode(65 + k) + '</span><span class="txt">' + esc(o) + '</span>' + '<i class="fa-solid fa-circle-check tick" aria-hidden="true"></i>' + '</button>').join('') + '</div>' +
    '<div class="quiz-actions"><button class="btn alt" data-act="prev"' + (i === 0 ? ' disabled' : '') + '>' + ic('arrow-left') + 'Previous</button>' +
      '<button class="btn alt" data-act="next"' + (i === n - 1 ? ' disabled' : '') + '>Next' + ic('arrow-right') + '</button>' +
      '<span class="spacer"></span><button class="btn" data-act="submit">' + ic('paper-plane') + 'Submit</button></div>' +
    '<div class="card"><h3>' + ic('grip') + ' Jump to a question</h3><div class="grid">' +
      Q.qs.map((_, k) => '<button class="' + (k === i ? 'cur' : (Q.answers[k] !== null ? 'done' : '')) + '" data-q="' + k + '">' + (k + 1) + '</button>').join('') + '</div></div>';

  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  tick();
}

function setSave(text, ok) {
  const m = document.getElementById('savemsg');
  if (!m) return;
  m.textContent = text;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
}

async function finish(auto) {
  clearInterval(timerId);
  const dl = document.getElementById('dlg');
  if (dl) dl.remove();
  if (!Q) return;
  const s = Q;
  Q = null;                       // stops a second submit
  db.del('br_quiz_' + uid);
  const lim = s.limit || LIMIT, n = s.qs.length, maxB = s.maxBonus != null ? s.maxBonus : 100;
  const isRight = (q, i) => s.answers[i] !== null && q.opts[s.answers[i]] === q.correct;
  const score = s.qs.reduce((c, q, i) => c + (isRight(q, i) ? 1 : 0), 0);
  const time = Math.max(1, Math.min(lim, Math.round((Math.min(Date.now(), s.end) - s.start) / 1000)));
  const base = s.qs.reduce((sum, q, i) => sum + (isRight(q, i) ? (q.p || PER[s.level]) : 0), 0);
  const bonus = Math.round((lim - time) / lim * maxB * score / n);
  const points = base + bonus;
  const result = {
    level: s.level, score, total: n, time, points, base, bonus, per: s.level === 'daily' ? null : PER[s.level],
    auto: !!auto, date: new Date().toLocaleDateString(),
    review: s.qs.map((q, i) => ({ q: q.q, correct: q.correct, chosen: s.answers[i] === null ? null : q.opts[s.answers[i]] }))
  };
  db.set('br_result_' + uid, result);
  if (s.level === 'daily') db.set('br_daily_' + uid, { day: utcDay(), points, score });
  if (auto) play('buzzer');
  renderResult(result, true);
  setSave('Saving your score...', true);
  const ok = await saveScore({ level: s.level, correct: score, total: n, points, time_seconds: time, play_day: localDay() });
  setSave(ok ? 'Your score was saved to the leaderboard.' : 'Could not save your score right now. It will be sent the next time you open the site online.', ok);
  loadRank(s.level);
  try { const r = await refreshBadges(); showNewBadges(r.fresh); } catch (e) {}
}

async function loadRank(level) {

    const rows = await lb(level, 1000, level === 'daily' ? 'day' : 'all');
    const i = rows.findIndex(x => x.username === user);
    setText('rank', i >= 0 ? '#' + (i + 1) : '-');

}

function countUp(id, to) {
  const el = document.getElementById(id);
  if (!el) return;
  if (reduceMotion() || to === 0) { el.textContent = to; return; }
  const t0 = performance.now(), dur = 800;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function confetti() {
  if (reduceMotion()) return;
  const wrap = document.createElement('div');
  wrap.className = 'confetti';
  wrap.setAttribute('aria-hidden', 'true');
  const cols = ['#22c55e', '#a3e635', '#facc15', '#4ade80', '#86efac'];
  for (let i = 0; i < 44; i++) {
    const p = document.createElement('i');
    p.className = 'fa-solid ' + (i % 3 === 0 ? 'fa-star' : 'fa-circle') + ' conf';
    p.style.left = rnd(100) + 'vw';
    p.style.color = cols[rnd(cols.length)];
    p.style.fontSize = (8 + rnd(12)) + 'px';
    p.style.animationDelay = (rnd(70) / 100) + 's';
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 3400);
}

function renderResult(r, fresh) {
  clearInterval(timerId);
  renderNav('');
  const pct = Math.round(r.score / r.total * 100);
  const note = r.level === 'daily' ? (pct >= 80 ? 'Excellent work! See you tomorrow.' : 'Come back tomorrow for a new challenge.')
    : pct >= 80 ? 'Excellent work!' : pct >= 50 ? 'Good effort. Try again to beat your score.' : 'Keep practicing. You can retry this level anytime.';
  const headIcon = pct >= 80 ? 'trophy' : pct >= 50 ? 'thumbs-up' : 'dumbbell';
  const breakdown = r.per ? r.score + ' correct × ' + r.per + ' points = ' + (r.score * r.per) + ', plus ' + r.bonus + ' speed bonus'
    : r.score + ' correct = ' + r.base + ' points, plus ' + r.bonus + ' speed bonus';
  const stat = (icon, big, small, id) => '<div><span class="ico">' + ic(icon) + '</span><div><strong' + (id ? ' id="' + id + '"' : '') + '>' + big + '</strong><span class="t">' + small + '</span></div></div>';

  app.innerHTML =
    (r.auto ? '<p class="msg err">Time is up. Your quiz was submitted automatically.</p>' : '') +
    '<p id="savemsg" class="msg ok" role="status"></p>' +
    '<div id="badge-slot"></div>' +
    '<div class="card rise"><div class="result-head"><h1>' + ic(headIcon) + ' Your results</h1><span class="pill">' + ic(LVL_ICON[r.level]) + levelName(r.level) + '</span></div>' +
    '<p class="score">' + ic('coins') + '<span id="score-num">' + r.points + '</span><small>points</small></p><p class="muted">' + breakdown + '. ' + note + '</p>' +
    '<div class="statrow">' + stat('bullseye', r.score + ' / ' + r.total, 'correct (' + pct + '%)') +
      stat('hourglass-half', fmtLong(r.time), 'time taken') + stat('ranking-star', '...', r.level === 'daily' ? "today's rank" : 'your rank on ' + LABEL[r.level], 'rank') + '</div>' +
    '<div class="actions">' + (r.level === 'daily' ? '' : '<button class="btn" data-start="' + r.level + '">' + ic('rotate-right') + 'Retry ' + LABEL[r.level] + '</button>') +
    '<button class="btn alt" data-board="' + r.level + '">' + ic('trophy') + 'Leaderboard</button>' +
    '<button class="btn ghost" data-go="home">' + ic('house') + 'Home</button></div></div>' +
    '<div class="card" style="margin-top:16px"><h2 style="margin-bottom:6px">' + ic('list-check') + ' Review your answers</h2>' +
    r.review.map((x, i) => {
      const ok = x.chosen === x.correct;
      return '<div class="rev ' + (ok ? 'ok' : 'no') + '"><strong>' + (i + 1) + '. ' + esc(x.q) + '</strong>' +
        (ok ? '<span class="good">' + ic('circle-check') + ' Your answer: ' + esc(x.chosen) + '</span>'
            : '<span class="bad">' + ic(x.chosen === null ? 'circle-minus' : 'circle-xmark') + ' Your answer: ' + (x.chosen === null ? 'not answered' : esc(x.chosen)) + '</span><br><span class="good">' + ic('circle-check') + ' Correct answer: ' + esc(x.correct) + '</span>') +
        '</div>';
    }).join('') + '</div>';
  loadRank(r.level);
  if (fresh) {
    countUp('score-num', r.points);
    if (pct >= 60) confetti();
    if (!r.auto) play(pct >= 60 ? 'win' : 'done');
  }
}

    '<p class="muted" style="margin:10px 0">This permanently deletes your account, scores, streak and badges, and removes you from the leaderboard. It cannot be undone.</p>' +
    '<p id="msg" class="msg err" role="alert"></p>' +
    '<div id="f"><label>Type DELETE to confirm<span class="field">' + ic('trash') + '<input name="confirm" autocomplete="off"></span></label>' +

    busy(true);
    const { error } = await sb.rpc('delete_my_account');
    if (error) {
      busy(false);
      return setMsg(/does not exist|schema cache|could not find/i.test(error.message || '') ? 'Account deletion is not set up yet. Run the delete-account SQL in Supabase first.' : friendly(error));

    ['br_quiz_', 'br_result_', 'br_daily_', 'br_badges_', 'br_pending_'].forEach(p => db.del(p + uid)); // wipe this player's data from the device
    db.del('br_last');
    try { await sb.auth.signOut(); } catch (e) {}
    user = null; uid = null; Q = null;
    renderAuth('login', { ok: true, t: 'Your account has been deleted.' });

  { id: 'first',    name: 'First steps',     icon: 'shoe-prints',       desc: 'Finish your first quiz.',                   need: 1,    have: s => s.quizzes },
  { id: 'ten',      name: 'Regular',         icon: 'repeat',            desc: 'Finish 10 quizzes.',                        need: 10,   have: s => s.quizzes },
  { id: 'fifty',    name: 'Dedicated',       icon: 'award',             desc: 'Finish 50 quizzes.',                        need: 50,   have: s => s.quizzes },
  { id: 'sharp',    name: 'Sharp mind',      icon: 'brain',             desc: 'Get 90% or more in a quiz.',                need: 1,    have: s => s.sharp },
  { id: 'perfect',  name: 'Perfectionist',   icon: 'star',              desc: 'Answer every question right in a quiz.',    need: 1,    have: s => s.perfect },
  { id: 'speed',    name: 'Speedster',       icon: 'bolt',              desc: 'Get 80% or more using half the time or less.', need: 1, have: s => s.speed },

  { id: 'daily5',   name: 'Daily habit',     icon: 'calendar-check',    desc: 'Finish 5 daily challenges.',                need: 5,    have: s => s.dailies },

/* everything below is worked out from the player's own finished quizzes */
function badgeStats(rows) {
  const st = { quizzes: rows.length, sharp: 0, perfect: 0, speed: 0, levels: 0, advBest: 0, dailies: 0, bestStreak: 0, points: 0 };
  const lv = new Set(), days = new Set();
  rows.forEach(r => {
    st.points += r.points || 0;
    if (r.play_day) days.add(r.play_day);
    const pct = r.total ? r.correct / r.total : 0;
    if (pct >= 0.9) st.sharp = 1;
    if (r.total && r.correct === r.total) st.perfect = 1;
    const lim = r.level === 'daily' ? DAILY.limit : LIMIT;
    if (pct >= 0.8 && r.time_seconds <= lim / 2) st.speed = 1;
    if (r.level === 'daily') st.dailies++; else lv.add(r.level);
    if (r.level === 'advanced') st.advBest = Math.max(st.advBest, r.correct);
  });
  st.levels = lv.size;
  const list = Array.from(days).sort();
  let run = 0, prev = null;
  list.forEach(d => {
    const t = Date.parse(d + 'T00:00:00Z');
    run = prev !== null && t - prev === 86400000 ? run + 1 : 1;
    prev = t;
    if (run > st.bestStreak) st.bestStreak = run;
  });
  return st;
}

async function fetchMyScores() {
  if (!sb || !navigator.onLine) throw new Error('offline');
  const { data, error } = await sb.from('scores').select('level,correct,total,points,time_seconds,play_day').limit(5000);
  if (error) throw error;
  return (data || []).concat(db.get('br_pending_' + uid, []));
}

/* works out the badges, saves them for offline, and says which ones are new since last time */
async function refreshBadges() {
  const rows = await fetchMyScores();
  const stats = badgeStats(rows);
  const earned = BADGES.filter(b => b.have(stats) >= b.need).map(b => b.id);
  const prev = db.get('br_badges_' + uid, null);
  db.set('br_badges_' + uid, { earned, stats });
  return { stats, earned, fresh: prev ? earned.filter(id => prev.earned.indexOf(id) < 0) : [] };
}

async function loadBadgeChip() {
  const cached = db.get('br_badges_' + uid, null);
  if (cached) setText('h-badges', cached.earned.length + '/' + BADGES.length);
  try {
    const r = await refreshBadges();
    setText('h-badges', r.earned.length + '/' + BADGES.length);
    const note = document.getElementById('h-badge-note');
    if (note && r.fresh.length) note.textContent = 'New badge unlocked: ' + r.fresh.map(id => BADGES.find(b => b.id === id).name).join(', ') + '.';
  } catch (e) { if (!cached) setText('h-badges', '-'); }
}

function showNewBadges(fresh) {
  const slot = document.getElementById('badge-slot');
  if (!slot || !fresh.length) return;
  slot.innerHTML = fresh.map(id => {
    const b = BADGES.find(x => x.id === id);
    return '<div class="card newbadge rise"><span class="bico">' + ic(b.icon) + '</span><div><h2>Badge unlocked: ' + esc(b.name) + '</h2><p class="muted">' + esc(b.desc) + '</p></div></div>';
  }).join('') + '<div class="actions" style="margin-bottom:16px"><button class="btn alt sm" data-go="badges">' + ic('award') + 'See all badges</button></div>';
  confetti();
  setTimeout(() => play('badge'), 350);
}

function badgeGrid(stats, earned) {
  const got = new Set(earned);
  return '<div class="badges">' + BADGES.map((b, i) => {
    const on = got.has(b.id);
    const have = Math.min(stats ? b.have(stats) : 0, b.need);
    return '<div class="badge' + (on ? ' on' : '') + ' rise" style="--i:' + (i % 8) + '"><span class="bico">' + ic(on ? b.icon : 'lock') + '</span><h3>' + esc(b.name) + '</h3><p>' + esc(b.desc) + '</p>' +
      (on ? '<span class="pill">' + ic('check') + 'Unlocked</span>'
          : '<div class="bprog"><div class="progress"><div class="fill" style="width:' + Math.round(have / b.need * 100) + '%"></div></div><span>' + have.toLocaleString() + ' / ' + b.need.toLocaleString() + '</span></div>') +
      '</div>';
  }).join('') + '</div>';
}

async function renderBadges() {
  clearInterval(timerId);
  renderNav('badges');
  const token = ++boardToken;
  const head = n => '<div class="page-head split rise"><div><h1>' + ic('award') + ' Badges</h1><p class="muted">Earn badges by playing, keeping streaks and scoring high.</p></div>' +
    '<ul class="chips"><li class="chip"><span class="ico">' + ic('award') + '</span><div><strong>' + n + '/' + BADGES.length + '</strong><span class="t">unlocked</span></div></li></ul></div>';
  const cached = db.get('br_badges_' + uid, null);

    (cached ? badgeGrid(cached.stats, cached.earned) : '<div class="card"><p class="empty"><i class="fa-solid fa-spinner fa-spin"></i>Loading...</p></div>') + '</div>';
  try {
    const r = await refreshBadges();
    if (token !== boardToken) return;
    app.innerHTML = head(r.earned.length) + '<p id="b-note" class="msg ok" role="status"></p><div id="b-body">' + badgeGrid(r.stats, r.earned) + '</div>';
  } catch (e) {
    if (token !== boardToken) return;
    if (cached) {
      const n = document.getElementById('b-note');
      if (n) { n.className = 'msg err'; n.textContent = "You're offline, so this shows your badges as of the last time you were online."; }
    } else {
      const b = document.getElementById('b-body');
      if (b) b.innerHTML = '<div class="card"><p class="empty">' + ic('plug-circle-xmark') + 'Connect to the internet to load your badges.</p></div>';
    }
  }
}

let boardPeriod = 'week';   // 'week' or 'all'
let boardLevel = 'easy';

/* The weekly board resets every Monday at 00:00 UTC */
function resetIn() {
  const d = new Date();
  const days = (8 - d.getUTCDay()) % 7 || 7;
  const target = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + days);
  const ms = Math.max(0, target - d.getTime());
  return Math.floor(ms / 86400000) + 'd ' + Math.floor(ms % 86400000 / 3600000) + 'h';
}

async function renderBoard(level) {
  clearInterval(timerId);
  renderNav('board');
  boardLevel = level;
  const token = ++boardToken;
  const daily = level === 'daily';
  const period = daily ? 'day' : boardPeriod;
  const week = period === 'week';
  const tabs = LEVELS.concat('daily', 'overall');
  const tabName = l => l === 'overall' ? 'Overall' : l === 'daily' ? 'Daily' : LABEL[l];
  const tabIcon = l => l === 'overall' ? 'globe' : LVL_ICON[l];
  const what = level === 'overall' ? 'all levels' : daily ? 'the daily challenge' : LABEL[level];
  const intro = daily ? "Today's daily challenge: the same questions for everyone. The board resets in " + untilMidnight() + ' (00:00 UTC).'
    : week ? 'Points earned this week on ' + what + '. The board resets in ' + resetIn() + ' (Monday, UTC).'
    : 'Total points earned on ' + what + ', all time.';

  app.innerHTML = '<div class="page-head rise"><h1>' + ic('trophy') + ' Leaderboard</h1>' +
    '<p class="muted">' + intro + ' Streak is how many days in a row a player has finished a quiz.</p></div>' +
    '<div class="row-tabs">' + (daily ? '<div></div>' :
      '<div class="tabs"><button class="seg-btn' + (week ? ' on' : '') + '" data-period="week">' + ic('calendar-week') + 'This week</button>' +
      '<button class="seg-btn' + (!week ? ' on' : '') + '" data-period="all">' + ic('infinity') + 'All time</button></div>') +
    '<button class="btn ghost sm" data-board="' + level + '">' + ic('rotate') + 'Refresh</button></div>' +
    '<div class="row-tabs" style="margin-top:0"><div class="tabs">' + tabs.map(l => '<button class="seg-btn' + (l === level ? ' on' : '') + '" data-board="' + l + '">' + ic(tabIcon(l)) + '<span class="lbl2">' + tabName(l) + '</span></button>').join('') + '</div></div>' +
    '<div class="card" id="lb-body"><p class="empty"><i class="fa-solid fa-spinner fa-spin"></i>Loading...</p></div>';

  let body;
  try {
    const rows = await lb(level === 'overall' ? null : level, 20, period);
    if (token !== boardToken) return;
    body = rows.length
      ? '<div class="tablewrap"><table><thead><tr><th>Rank</th><th>Player</th><th>' + (daily ? 'Points today' : week ? 'Points this week' : 'Total points') + '</th><th>Streak</th></tr></thead><tbody>' +
        rows.map((b, i) => '<tr' + (b.username === user ? ' class="me"' : '') + '><td><span class="rank r' + (i + 1) + '" aria-label="Rank ' + (i + 1) + '">' + (i < 3 ? ic('medal') : (i + 1)) + '</span></td>' +
          '<td class="name">' + esc(b.username) + '</td><td>' + ic('coins') + ' ' + b.total_points + '</td>' +
          '<td><span class="streak' + (b.streak ? '' : ' off') + '">' + ic('fire') + b.streak + (b.streak === 1 ? ' day' : ' days') + '</span></td></tr>').join('') +
        '</tbody></table></div>'
      : '<p class="empty">' + ic('ghost') + (daily ? "Nobody has played today's challenge yet. Be the first!" : week ? 'No points yet this week. Be the first on the board!' : 'No points yet' + (level === 'overall' ? '' : ' on ' + LABEL[level]) + '. Finish a quiz to get on the board.') + '</p>';
  } catch (e) {
    if (token !== boardToken) return;
    body = navigator.onLine
      ? '<p class="empty">' + ic('plug-circle-exclamation') + 'Could not load the leaderboard. Check your connection and press Refresh.</p>'
      : '<p class="empty">' + ic('plug-circle-xmark') + "You're offline. Connect to the internet to see the leaderboard." + '</p>';
  }
  const el = document.getElementById('lb-body');
  if (el) el.innerHTML = body;
}

/* ---------- In-page confirm ---------- */
function ask(text, yes) {
  pendingYes = yes;
  const old = document.getElementById('dlg');
  if (old) old.remove();
  const d = document.createElement('div');
  d.id = 'dlg';
  d.innerHTML = '<div class="dlgbox" role="alertdialog"><span class="ico">' + ic('circle-question') + '</span><p>' + esc(text) + '</p>' +
    '<div class="actions"><button class="btn alt" data-dlg="no">Cancel</button><button class="btn" data-dlg="yes">' + ic('check') + 'Yes</button></div></div>';
  document.body.appendChild(d);
}
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-dlg]');
  if (!b) return;
  const yes = pendingYes;
  pendingYes = null;
  const d = document.getElementById('dlg');
  if (d) d.remove();
  if (b.dataset.dlg === 'yes' && yes) yes();
});

/* ---------- Click handling ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;

  if (d.submit) { if (onSubmit && document.getElementById('f')) onSubmit(); return; }
  if (d.auth) return renderAuth(d.auth);
  if (d.install) {
    if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; fillInstall(); }); }
    return;
  }
  if (d.retry) return enter();
  if (d.go === 'home') return renderHome();
  if (d.go === 'badges') return renderBadges();
  if (d.go === 'privacy') return renderPrivacy();
  if (d.go === 'delete') return renderDelete();
  if (d.go === 'logout') return doLogout();
  if (d.period) { boardPeriod = d.period; return renderBoard(boardLevel); }
  if (d.board) return renderBoard(d.board);
  if (d.start) return startQuiz(d.start);
  if (d.resume) return renderQuiz();
  if (d.discard) {
    ask('Discard this quiz? Your answers will be lost.', () => {
      db.del('br_quiz_' + uid); Q = null; renderHome();
    });
    return;
  }
  if (d.result) {
    const r = db.get('br_result_' + uid, null);
    if (r) renderResult(r, false);
    return;
  }

  if (!Q) return;
  if (d.opt !== undefined) { Q.answers[Q.cur] = Number(d.opt); saveQ(); return renderQuiz(); }
  if (d.q !== undefined) { Q.cur = Number(d.q); saveQ(); return renderQuiz(); }
  if (d.act === 'prev' && Q.cur > 0) { Q.cur--; saveQ(); return renderQuiz(); }
  if (d.act === 'next' && Q.cur < Q.qs.length - 1) { Q.cur++; saveQ(); return renderQuiz(); }
  if (d.act === 'submit') {
    const left = Q.answers.filter(a => a === null).length;
    const text = left ? 'You have ' + left + ' unanswered question' + (left > 1 ? 's' : '') + '. Submit anyway?' : 'Submit your answers now?';
    ask(text, () => finish(false));
  }
});

app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.closest('#f') && onSubmit) {
    e.preventDefault();
    onSubmit();
  }
});

/* ---------- Start ---------- */
/* Some previews cannot copy Headers objects or abort signals between frames, so turn them into plain data first */
function safeFetch(url, opts) {
  const o = Object.assign({}, opts || {});
  if (o.headers && typeof o.headers.forEach === 'function' && !Array.isArray(o.headers)) {
    const h = {};
    o.headers.forEach((v, k) => { h[k] = v; });
    o.headers = h;
  }
  delete o.signal;
  return fetch(typeof url === 'string' ? url : String(url.url || url), o);
}

async function init() {
  renderNav();
  updateNet();
  if (typeof BANK === 'undefined') {
    app.innerHTML = '<div class="card narrow-card"><h2>' + ic('triangle-exclamation') + ' Questions did not load</h2><p class="muted" style="margin-top:8px">Make sure questions.js is uploaded in the same folder as index.html, then refresh.</p></div>';
    return;
  }
  if (typeof supabase === 'undefined') {
    const c = db.get('br_last', null);
    if (c) return startOffline(c);
    return renderSetup('The Supabase library did not load. Check your internet connection and refresh.');
  }
  if (SUPABASE_URL.includes('PASTE') || SUPABASE_KEY.includes('PASTE')) return renderSetup('');

  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    global: { fetch: safeFetch },
    auth: { flowType: 'implicit', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  /* The reset-password email link brings the person back here with a recovery token in the address */
  if (/error_code=|error_description=/.test(location.hash)) {
    history.replaceState(null, '', location.pathname + location.search);
    return renderAuth('login', { t: 'That link is invalid or has expired. Request a new reset link.' });
  }
  if (/type=recovery/.test(location.hash)) recovering = true;
  sb.auth.onAuthStateChange(event => {
    if (event === 'PASSWORD_RECOVERY') { recovering = true; setTimeout(renderRecovery, 0); }
  });
  if (recovering) {
    setTimeout(() => { if (recovering && !document.getElementById('f')) renderRecovery(); }, 1000);
    return;
  }
  await enter();
}

/* ---------- Offline bar ---------- */
let netTimer = null;
function updateNet(fromEvent) {
  const bar = document.getElementById('netbar');
  if (!bar) return;
  clearTimeout(netTimer);
  if (!navigator.onLine) {
    bar.innerHTML = ic('plug-circle-xmark') + "You're offline. You can still play. Scores upload when you're back online.";
    bar.hidden = false;
  } else if (fromEvent) {
    bar.innerHTML = ic('wifi') + 'Back online.';
    bar.hidden = false;
    netTimer = setTimeout(() => { bar.hidden = true; }, 2500);
  } else {
    bar.hidden = true;
  }
}
window.addEventListener('offline', () => updateNet(true));
window.addEventListener('online', async () => {
  updateNet(true);
  if (sb && uid) { try { await sb.auth.getSession(); } catch (e) {} flushPending(); }
});

/* ---------- Install as an app ---------- */
let installEvt = null;
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
function fillInstall() {
  const slot = document.getElementById('install-slot');
  if (!slot) return;
  if (standalone() || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) { slot.innerHTML = ''; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  slot.innerHTML = '<div class="card install rise"><span class="ico">' + ic('mobile-screen-button') + '</span><div><h3>Get the app</h3><p class="muted">' +
    (installEvt ? 'Install Brain Rush to play offline. The leaderboard still needs internet.'
      : ios ? 'On iPhone: tap the Share button, then Add to Home Screen. After that you can play offline.'
      : 'Open your browser menu and choose Install app or Add to Home screen. After that you can play offline.') + '</p></div>' +
    (installEvt ? '<button class="btn" data-install="1">' + ic('download') + 'Install</button>' : '') + '</div>';
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; fillInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; fillInstall(); });

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* ---------- Visitor counts (Cloudflare Web Analytics) ---------- */
function startAnalytics() {
  if (!CF_ANALYTICS_TOKEN || !/^https?:$/.test(location.protocol)) return;
  const sc = document.createElement('script');
  sc.defer = true;
  sc.src = 'https://static.cloudflareinsights.com/beacon.min.js';
  sc.setAttribute('data-cf-beacon', JSON.stringify({ token: CF_ANALYTICS_TOKEN }));
  document.head.appendChild(sc);
}
startAnalytics();

init();
</script>
